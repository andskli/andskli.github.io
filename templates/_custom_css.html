<style>

    --callout-note-color: #5871a2;
    --callout-important-color: #8062b0;

    --callout-alert-color: #bc5252;
    --callout-question-color: #477389;

  body.dark {
    --primary-color: #5d77ac;
    --primary-pale-color: #5d77ac20;
    --text-color: #b0b5c1;
    --text-pale-color: #626975;

    --highlight-mark-color: #5f75b045;
    --menu-border-color: #465061;

    --callout-note-color: #5d77ac;
    --callout-important-color: #8062b0;

    --callout-alert-color: #bc5252;
    --callout-question-color: #477389;
    --callout-tip-color: #3c8460;
  }

  body {
    --main-font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    --code-font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

    --avatar-size: 60px;

    --block-code-border-color: var(--primary-color);
  }

  /* Keep the primary destinations distinct from text links and social icons.

  body.homepage #links #left.site-menu {
    gap: 0.75rem;
    max-width: 100%;
  }

  body.homepage #links #left > .menu-link {

    text-align: center;
    text-decoration: none;
  }

  body.homepage #links #left > .menu-link:hover,
  body.homepage #links #left > .menu-link:focus-visible {
    color: var(--text-color);
    border-color: var(--primary-color);
    background-color: var(--highlight-mark-color);
  }

  body.homepage #links #left > .menu-link:focus-visible {
    outline: 2px solid var(--primary-color);
    outline-offset: 3px;
  }

  .prose p {
    text-align: justify;
